# cargo-deny 配置 —— 依赖安全与来源治理。
#
# 运行（本地与 CI 同一条命令；CI 在 rust job 里跑，二进制钉版 0.20.2 + sha256 校验）：
#   cargo deny check advisories sources
#
# 只开 advisories 与 sources：这两条都是「有事实依据就能判定」的检查，
# [bans] / [licenses] 一开就会大面积报出与本次治理无关的历史债，先不开。
#
# 本地网络提示：本机对 github.com 的 HTTPS 可能不通（SSH 通），首次拉
# advisory-db 若失败就加 `--offline` 复用已有缓存（%USERPROFILE%\.cargo\advisory-dbs\）。

[graph]
# 交付目标只有 Windows x64；按它评估依赖图，不把其他平台的可选依赖算进风险面。
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# Cargo.lock 入库：出现 yanked 就说明锁文件该更新了，直接失败。
yanked = "deny"
# unmaintained = "workspace"：只把「本仓库直接依赖」里的停维护 crate 当错误。
# 传递依赖里已知修不动的一批（实测：fxhash、paste、proc-macro-error2、rand_os、
# unic-* —— 分别来自 tauri-utils / punkt 的旧链）降为提示；一个都修不了的门禁
# 等于没有门禁，只会被无视。
unmaintained = "workspace"
# 刻意保持最小：只放「传递依赖 + 修复位置不在本仓库」的通告，并写明摘除条件。
# unused-ignored-advisory = "deny"：豁免一旦不再命中（上游修了/升级了），
# 构建会红着提醒你把它删掉，不留烂账。
unused-ignored-advisory = "deny"
ignore = [
    # rustc-serialize（punkt → num 0.1 → …）的 JSON 深嵌套栈溢出。
    # punkt 是我们自己的 fork：摘除条件 = 在 rust-punkt 仓库里升级 num 依赖后换 rev；
    # 在那之前它只经 punkt 内部使用，不是本仓库对外的解析入口。
    "RUSTSEC-2022-0004",
    # zip 2.4.2（ndarray-npy → fireredvad）的三条公告：RUSTSEC-2026-0367
    # （解压时保留 SUID/SGID 位）、0368 / 0369（extract() 跟随符号链接）。
    # 三条都只命中「解压不可信归档」这一条路径，而本项目不调用 extract：
    # ndarray-npy 的 npz.rs 只用 ZipArchive::by_name / by_index 和 ZipWriter，
    # 读的是编译期嵌入二进制的自家 weights.npz，没有外部归档入口。
    # 为什么停在 2.4.2：三条的修复版本都是 zip >= 9.0.0，^2 线最新的 2.6.1
    # 仍在受影响范围内，升它清不掉门禁。跨到 ^9 要 ndarray-npy 先动
    # （0.9 锁 zip ^2、0.10 锁 ^6）——它在 npz.rs 里对 zip 只有 5 处引用，
    # 移植量很小，届时连同 fireredvad 一起升。
    # 摘除条件 = ndarray-npy 升到 zip ^9 后删掉这三条。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # RUSTSEC-2026-0429 是同一 extract() 路径的第四条（symlink 目标缓冲区按
    # 归档声明的大小预分配，恶意档案可撑爆内存）：与上面三条同源同理，
    # 本仓库不调用 extract。摘除条件同上。
    "RUSTSEC-2026-0429",
    # zstd 链（include-flate-compress ← include-flate ← jieba-rs / 内嵌本地化数据）
    # 的三条通告：0391 = with_context 复用流上下文导致跨流数据泄漏；0398 =
    # Seekable::decompress 对越界 offset 设置超容量长度；0403 = legacy 帧流式
    # 解压失败时暴露未初始化内存。本仓库只经 include-flate 调用
    # ZstdDecoder::new / ZstdEncoder::new——每次新建上下文、不用 seekable，
    # 且压缩与解压的都是编译期嵌入的自有数据（本地化 JSON、jieba 词典），
    # 不存在不可信帧、也不跨流复用上下文。
    # 为什么不升：依赖版本钉死，且升级要连带 zstd 0.13 → 0.13.4+ /
    # zstd-safe 7.4+；上述缺陷调用面与我们的用法不相交。
    # 摘除条件 = include-flate 链升到 zstd >= 0.13.4（zstd-safe >= 7.4）后删除。
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    # zstd-sys 2.0.16 的 wasm32 分配器 shim（RUSTSEC-2026-0410，2026-11 发布）：
    # shim 只在 wasm32 目标上参与编译，本项目交付目标只有 Windows x64，
    # [graph].targets 也只按 x64 评估——受影响代码不可能进入任何产物。
    # 为什么不升：依赖版本钉死，不跟随与本项目目标平台不相交的公告移动锁；
    # zstd-sys 是 include-flate-compress → jieba-rs 的传递依赖，锁不动就是零影响。
    # 摘除条件 = 真正引入 wasm32 交付目标（或上游链自然升到 zstd-sys >= 2.1.2）后删掉这条。
    "RUSTSEC-2026-0410",
    # libsqlite3-sys 0.30.1（C SQLite 3.54 之前，CVE-2026-119375）：需要同时
    # 打开一份数据库与其旁路 -wal，且两者页大小不一致时，普通查询可能读到
    # 进程内存里的陈旧字节。攻击要求本地文件写入权限——本应用只打开
    # %APPDATA%\com.voxtrans.desktop\voxtrans.db 自己的库，不提供导入第三方
    # SQLite 文件的入口；同用户把文件放进这个目录时已可替换程序本身，
    # 该向量不再提供额外能力。
    # 为什么不升：0.39（修复版）不在 sqlx-sqlite 0.8.6 的 ^0.30.1 约束内，
    # 升它等于升级 sqlx 整条链；依赖版本钉死，不为此移动。
    # 摘除条件 = sqlx 升级到依赖 libsqlite3-sys >= 0.39 的版本后删除。
    "RUSTSEC-2026-0459",
]

[sources]
# 依赖只允许来自 crates.io（默认）与 allow-git 里逐个列出的仓库。
unknown-registry = "deny"
unknown-git = "deny"
# 精确 URL 匹配（不支持通配符），.git 后缀按 cargo 的归一化省掉。
# 新增 git 依赖必须同时改这里 —— 这正是想要的：来路不明的 fork 在 CI 被拦下，
# 而不是静静进入产物。
allow-git = [
    "https://github.com/eclipse005/cohere-transcribe-rs",
    "https://github.com/eclipse005/ctc-aligner-rs",
    "https://github.com/eclipse005/FireRedVad",
    "https://github.com/eclipse005/moss-transcribe-diarize-rs",
    "https://github.com/eclipse005/nagisa-rs",
    "https://github.com/eclipse005/qwen-aligner-rs",
    "https://github.com/eclipse005/qwen3-asr-rs",
    "https://github.com/eclipse005/rust-punkt",
]
# 必须带 tag 或 rev（punkt 就是被这条抓出来的）。
required-git-spec = "tag"
# 清单里列了却没被用到的 URL 直接报错：既防呆，也防止删依赖后清单烂在那里。
unused-allowed-source = "deny"
