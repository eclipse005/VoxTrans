# Push / PR gate: the jobs run what `npm run verify` runs locally, on a machine
# that is not the maintainer's — that is the point (the fresh-checkout gap this
# caught: bindings that were never committed). Release building lives in
# release.yml; nothing here publishes or needs secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Frontend + static checks on Linux: fast to schedule, and a second OS
  # catches import-case mistakes Windows cannot see. Node only — the ts-rs
  # bindings are committed, so nothing Rust has to build to typecheck.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # version consistency, binaries manifest, eslint, vitest (incl. the
      # locale guard) and tsc + vite build — the same script as locally.
      - run: npm run verify:fast

  # The Rust half where it can actually run: the crate is Windows-targeted
  # (windows-sys, MSVC-linked engines), so the runner is windows-latest too.
  # This is the only place the suite runs outside the maintainer's machine.
  rust:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Channel comes from rust-toolchain.toml — the file is the single source,
      # so CI runs the same compiler the maintainer does. Bumping the toolchain
      # is deliberate (see the file's comment).
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # tauri-build validates bundle.resources while compiling the crate, so
      # src-tauri/bin must hold ffmpeg/yt-dlp/demucs before clippy or test can
      # build voxtrans (first CI run failed exactly there with "resource path
      # 'bin\demucs.exe' doesn't exist"). Same digest-verified download the
      # packaging jobs use; the token lifts the anonymous API rate limit that
      # shared runner IPs keep hitting.
      - name: Download bundled binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\download-binaries.ps1
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Both packages spelled out: `-p voxtrans` alone leaves voxtrans-core's
      # tests out of the run.
      - name: test
        run: cargo test -p voxtrans -p voxtrans-core
      # The committed bindings must match the Rust types. Regenerating must not
      # change a byte; when it does, run `npm run generate:types` locally and
      # commit the diff with the type change.
      - name: ts-rs bindings are in sync
        run: |
          cargo test -p voxtrans ts_export_tests
          git diff --exit-code -- src/generated
